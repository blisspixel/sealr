[workspace]

[package]
name = "sealr"
version = "0.1.0-alpha.19"
edition = "2024"
# Kani 0.67.0 compiles with Rust 1.93. Required CI compiles the product
# with the workspace toolchain. This pin is the proof compiler, not the MSRV.
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[package.metadata.kani.flags]
default-unwind = "1"

[workspace]
resolver = "2"
members = [
    "crates/sealr",
    "crates/sealr-cli",
    "crates/sealr-protocol",
    "tools/identity-verifier",
    "tools/materialization-lifecycle",
    "tools/release-license-closure",
    "tools/worker-bootstrap",
    "tools/wheel-lab",
]

[workspace.package]
version = "0.1.0-alpha.6"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/blisspixel/sealr"
description = "High-assurance boundary for untrusted archives"

[workspace.dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
crc32fast = "1.4"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4.3"
libc = "0.2.175"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_ProcessStatus", "Win32_System_SystemServices", "Win32_System_Threading"] }

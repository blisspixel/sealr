[workspace]
resolver = "2"
members = ["crates/sealr", "crates/sealr-cli"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/blisspixel/sealr"
description = "High-assurance boundary for untrusted archives"

[workspace.dependencies]
cap-std = "4.0.3"
crc32fast = "1.4"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

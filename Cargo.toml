[workspace]
resolver = "2"
members = [
    "crates/sealr",
    "crates/sealr-cli",
    "crates/sealr-protocol",
    "tools/identity-verifier",
    "tools/materialization-lifecycle",
    "tools/release-license-closure",
    "tools/worker-bootstrap",
    "tools/wheel-lab",
    "tools/wheel-inventory-v4",
    "tools/attest",
    "tools/wheel-inventory-v5",
]

[workspace.package]
version = "0.1.0-alpha.13"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/blisspixel/sealr"
description = "High-assurance boundary for untrusted archives"

[workspace.dependencies]
bzip2 = "=0.6.1"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
caseless = "=0.2.2"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4.3"
libc = "0.2.175"
lzma-rust2 = { version = "=0.20.0", default-features = false, features = ["std", "xz"] }
pep440_rs = "=0.7.3"
ruzstd = { version = "=0.9.0", default-features = false, features = ["hash", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
twox-hash = { version = "=2.1.4", default-features = false, features = ["xxhash64"] }
unicode-general-category = "=1.1.0"
unicode-normalization = "=0.1.25"
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_ProcessStatus", "Win32_System_SystemServices", "Win32_System_Threading"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[package]
name = "sealr-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
sealr = { path = "../crates/sealr", version = "=0.1.0-alpha.10", features = ["__internal-fuzzing"] }
sealr-worker-protocol = { path = "../crates/sealr-protocol", version = "=0.1.0-alpha.10" }

[[bin]]
name = "protocol_decoders"
path = "fuzz_targets/protocol_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "semantic_records"
path = "fuzz_targets/semantic_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tar_ustar_portable_v1"
path = "fuzz_targets/tar_ustar_portable_v1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gzip_rfc1952_single_member_v1"
path = "fuzz_targets/gzip_rfc1952_single_member_v1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip64_strict_ascii_v1"
path = "fuzz_targets/zip64_strict_ascii_v1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tar_gzip_ustar_portable_v1"
path = "fuzz_targets/tar_gzip_ustar_portable_v1.rs"
test = false
doc = false
bench = false

[workspace]

name: Scheduled fuzz

on:
  schedule:
    - cron: "31 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  protocol:
    name: Bounded worker protocol
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-08-01 --profile minimal

      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-08-01 install cargo-fuzz --version 0.13.2 --locked

      - name: Verify seed and configuration manifest
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/verify_fuzz_seeds.ps1

      - name: Fuzz bounded protocol decoders
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/sealr-fuzz-artifacts/"
          mkdir -p "${artifact_dir}"
          cargo +nightly-2026-08-01 fuzz run \
            --fuzz-dir fuzz \
            --jobs 1 \
            protocol_decoders \
            -- \
            -jobs=1 \
            -max_len=4194304 \
            -max_total_time=600 \
            -timeout=5 \
            -rss_limit_mb=1024 \
            -artifact_prefix="${artifact_dir}" \
            -dict=fuzz/dictionaries/protocol_dictionary \
            -print_final_stats=1

      - name: Preserve reproducer after a failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-decoder-reproducer
          path: ${{ runner.temp }}/sealr-fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 7


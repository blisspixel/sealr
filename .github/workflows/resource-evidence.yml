name: Scheduled resource evidence

on:
  schedule:
    - cron: '17 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0

jobs:
  multigigabyte-sparse:
    name: 3 GiB sparse gate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal

      - name: Select pinned Rust
        run: rustup default ${{ env.RUST_VERSION }}

      - name: Run multi-gigabyte sparse resource gate
        run: >-
          cargo test --locked --release -p sealr --test bounded_path_memory
          multigigabyte_sparse_path_input_stays_within_the_heap_budget --
          --ignored --exact --nocapture

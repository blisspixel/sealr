name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0

jobs:
  quality:
    name: Format, lint, test, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" |
            sha256sum --check
          tar -C "${RUNNER_TEMP}" -xzf "${archive}" actionlint
          "${RUNNER_TEMP}/actionlint"

      - name: Verify release candidate selection
        shell: bash
        run: bash scripts/verify_release_candidate.sh

      - name: Parse PowerShell automation
        shell: pwsh
        run: |
          $errors = $null
          Get-ChildItem -LiteralPath scripts -Filter '*.ps1' | ForEach-Object {
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              throw "PowerShell parse failed for $($_.Name): $($errors -join '; ')"
            }
          }

      - name: Verify documentation contracts
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/verify_docs.ps1

      - name: Verify fuzz seeds and bounds
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/verify_fuzz_seeds.ps1

      - name: Verify assurance and promotion contracts
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/verify_assurance.ps1

      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy,rustfmt

      - name: Select pinned Rust
        run: rustup default ${{ env.RUST_VERSION }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Stress native materialization lifecycle
        run: cargo run --locked --release -p sealr-materialization-lifecycle

      - name: Measure near-limit semantic completion heap
        run: >-
          cargo test --locked --release -p sealr --lib
          semantic_record::peak_live::completion_reconstruction_peak_live_is_bounded --
          --ignored --exact --nocapture --test-threads=1

      - name: Verify Linux authority bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release -p sealr-worker-bootstrap-lab \
            --no-default-features --bin sealr-worker \
            --target x86_64-unknown-linux-musl
          worker="${PWD}/target/x86_64-unknown-linux-musl/release/sealr-worker"
          readelf --file-header "${worker}" | grep --extended-regexp --quiet \
            'Class:[[:space:]]+ELF64'
          readelf --file-header "${worker}" | grep --extended-regexp --quiet \
            'Machine:[[:space:]]+Advanced Micro Devices X86-64'
          if readelf --program-headers "${worker}" | grep --quiet 'INTERP'; then
            echo 'production helper must not contain a program interpreter' >&2
            exit 1
          fi
          if "${worker}" >/dev/null 2>&1; then
            echo 'production helper accepted direct invocation' >&2
            exit 1
          fi
          if "${worker}" --help >/dev/null 2>&1; then
            echo 'production helper exposed a command surface' >&2
            exit 1
          fi
          worker_bytes="$(stat --format=%s "${worker}")"
          worker_sha256="$(sha256sum "${worker}" | cut --delimiter=' ' --fields=1)"
          cargo run --locked --release -p sealr-worker-bootstrap-lab \
            --features lab --bin sealr-worker-bootstrap-lab -- \
            conformance --worker "${worker}" --bytes "${worker_bytes}" \
            --sha256 "${worker_sha256}"

      - name: Compile fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins

      - name: Compile Kani proof manifest with production Rust
        run: cargo check --locked --manifest-path verification/kani/Cargo.toml

      - name: Verify independent identity conformance
        run: >-
          cargo run --locked -p sealr-identity-verifier --
          crates/sealr/tests/conformance/identity-v1.json

      - name: Verify committed wheel compatibility report
        run: >-
          cargo run --locked -p sealr-wheel-lab -- verify-report
          tests/corpus/wheels/manifest.json
          tests/corpus/wheels/report.json
          docs/wheel-compatibility-pilot.md

      - name: Build optimized workspace
        run: cargo build --locked --release --workspace --all-features

      - name: Build extracted-package consumer
        run: |
          cargo package --locked -p sealr
          cargo build --locked --release --manifest-path tests/packaged-consumer/Cargo.toml

      - name: Verify native release package contract
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $versions = @($metadata.packages.version | Sort-Object -Unique)
          if ($versions.Count -ne 1) {
            throw "workspace packages do not have one release version: $($versions -join ', ')"
          }
          $archive = Join-Path $PWD "target/native-package-contract/sealr-$($versions[0])-x86_64-unknown-linux-gnu.tar.gz"
          pwsh -NoLogo -NoProfile -File scripts/package_native.ps1 `
            -Version $versions[0] `
            -TargetTriple x86_64-unknown-linux-gnu `
            -HelperBinary target/x86_64-unknown-linux-musl/release/sealr-worker `
            -OutputDirectory target/native-package-contract
          pwsh -NoLogo -NoProfile -File scripts/verify_native_package.ps1 `
            -ArchivePath $archive `
            -Version $versions[0] `
            -TargetTriple x86_64-unknown-linux-gnu `
            -LabBinary target/release/sealr-worker-bootstrap-lab `
            -WheelLabBinary target/release/sealr-wheel-lab `
            -PackagedConsumerBinary tests/packaged-consumer/target/release/sealr-packaged-consumer

      - name: Verify README walkthrough
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File scripts/walkthrough.ps1 -SkipBuild
          pwsh -NoLogo -NoProfile -File scripts/render_walkthrough.ps1
          pwsh -NoLogo -NoProfile -File scripts/verify_walkthrough_assets.ps1

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p sealr -p sealr-worker-protocol --all-features --no-deps

  platform:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal

      - name: Select pinned Rust
        run: rustup default ${{ env.RUST_VERSION }}

      - name: Install 32-bit Windows target
        if: runner.os == 'Windows'
        run: rustup target add i686-pc-windows-msvc

      - name: Check 32-bit Windows ABI
        if: runner.os == 'Windows'
        run: cargo check --locked -p sealr --target i686-pc-windows-msvc

      - name: Run release tests
        run: cargo test --locked --release --workspace --all-features

      - name: Stress native materialization lifecycle
        run: cargo run --locked --release -p sealr-materialization-lifecycle

      - name: Measure near-limit semantic completion heap
        run: >-
          cargo test --locked --release -p sealr --lib
          semantic_record::peak_live::completion_reconstruction_peak_live_is_bounded --
          --ignored --exact --nocapture --test-threads=1

      - name: Verify native release package contract
        shell: pwsh
        run: |
          cargo build --locked --release -p sealr-cli
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $versions = @($metadata.packages.version | Sort-Object -Unique)
          if ($versions.Count -ne 1) {
            throw "workspace packages do not have one release version: $($versions -join ', ')"
          }
          $targetLine = rustc -vV | Select-String -Pattern '^host: '
          if ($null -eq $targetLine) {
            throw 'rustc did not report its host target'
          }
          $targetTriple = $targetLine.Line.Substring(6).Trim()
          $extension = if ($IsWindows) { 'zip' } else { 'tar.gz' }
          $archive = Join-Path $PWD "target/native-package-contract/sealr-$($versions[0])-$targetTriple.$extension"
          pwsh -NoLogo -NoProfile -File scripts/package_native.ps1 `
            -Version $versions[0] `
            -TargetTriple $targetTriple `
            -OutputDirectory target/native-package-contract
          pwsh -NoLogo -NoProfile -File scripts/verify_native_package.ps1 `
            -ArchivePath $archive `
            -Version $versions[0] `
            -TargetTriple $targetTriple

  zipdiff:
    name: ZipDiff 14-class gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZIPDIFF_REVISION: 7c427ed254bb3a5985d54870c12f97db78118e67
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal

      - name: Select pinned Rust
        run: rustup default ${{ env.RUST_VERSION }}

      - name: Fetch pinned ZipDiff source
        run: |
          set -euo pipefail
          zipdiff_dir="${RUNNER_TEMP}/ZipDiff"
          git init "${zipdiff_dir}"
          git -C "${zipdiff_dir}" remote add origin https://github.com/ouuan/ZipDiff.git
          git -C "${zipdiff_dir}" fetch --depth 1 origin "${ZIPDIFF_REVISION}"
          git -C "${zipdiff_dir}" checkout --detach FETCH_HEAD
          test "$(git -C "${zipdiff_dir}" rev-parse HEAD)" = "${ZIPDIFF_REVISION}"

      - name: Make generated timestamps deterministic
        run: |
          set -euo pipefail
          zipdiff_dir="${RUNNER_TEMP}/ZipDiff"
          patch_file="${GITHUB_WORKSPACE}/tests/corpus/zipdiff/deterministic-timestamps.patch"
          git -C "${zipdiff_dir}" apply --check "${patch_file}"
          git -C "${zipdiff_dir}" apply "${patch_file}"
          grep -Fq 'Self::new(0, 0)' "${zipdiff_dir}/zip-diff/src/fields.rs"

      - name: Generate construction corpus
        working-directory: ${{ runner.temp }}/ZipDiff/zip-diff
        run: cargo run --locked --release --bin construction

      - name: Verify construction expectations
        run: >-
          cargo run --locked --release -p sealr --example classify_zipdiff --
          "${RUNNER_TEMP}/ZipDiff/constructions"
          --expect tests/corpus/zipdiff/expectations.txt

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal

      - name: Select pinned Rust
        run: rustup default ${{ env.RUST_VERSION }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check advisories, licenses, bans, and sources
        run: |
          cargo deny check
          cargo deny --manifest-path fuzz/Cargo.toml check
          cargo deny --manifest-path verification/kani/Cargo.toml check
          cargo package --locked -p sealr
          cargo deny --manifest-path tests/packaged-consumer/Cargo.toml check

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Fetch supported release dependency graphs
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          cargo fetch --locked --target aarch64-apple-darwin
          cargo fetch --locked --target x86_64-pc-windows-msvc

      - name: Verify third-party license bundles
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/verify_third_party_licenses.ps1

  kernel-floor:
    name: Real-kernel Landlock ABI 2 floor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install guest tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cpio qemu-system-x86

      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal

      - name: Select pinned Rust
        run: rustup default ${{ env.RUST_VERSION }}

      - name: Verify fail-closed behavior on Landlock ABI 2
        shell: bash
        run: bash scripts/verify_kernel_floor.sh

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [quality, platform, zipdiff, supply-chain, kernel-floor]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every promotion gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          ZIPDIFF_RESULT: ${{ needs.zipdiff.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs['supply-chain'].result }}
          KERNEL_FLOOR_RESULT: ${{ needs['kernel-floor'].result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for gate in \
            QUALITY_RESULT \
            PLATFORM_RESULT \
            ZIPDIFF_RESULT \
            SUPPLY_CHAIN_RESULT \
            KERNEL_FLOOR_RESULT; do
            result="${!gate}"
            if [[ "${result}" != "success" ]]; then
              echo "::error::${gate} completed as ${result}"
              failed=1
            fi
          done
          exit "${failed}"

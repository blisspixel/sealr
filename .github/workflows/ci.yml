name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0

jobs:
  quality:
    name: Format, lint, test, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" |
            sha256sum --check
          tar -C "${RUNNER_TEMP}" -xzf "${archive}" actionlint
          "${RUNNER_TEMP}/actionlint"

      - name: Verify release candidate selection
        shell: bash
        run: bash scripts/verify_release_candidate.sh

      - name: Parse PowerShell automation
        shell: pwsh
        run: |
          $errors = $null
          Get-ChildItem -LiteralPath scripts -Filter '*.ps1' | ForEach-Object {
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              throw "PowerShell parse failed for $($_.Name): $($errors -join '; ')"
            }
          }

      - name: Verify documentation contracts
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/verify_docs.ps1

      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy,rustfmt

      - name: Select pinned Rust
        run: rustup default ${{ env.RUST_VERSION }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Build optimized workspace
        run: cargo build --locked --release --workspace --all-features

      - name: Verify README walkthrough
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File scripts/walkthrough.ps1 -SkipBuild
          pwsh -NoLogo -NoProfile -File scripts/render_walkthrough.ps1
          pwsh -NoLogo -NoProfile -File scripts/verify_walkthrough_assets.ps1

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p sealr --all-features --no-deps

      - name: Verify packaged library
        run: cargo package --locked -p sealr

  platform:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal

      - name: Select pinned Rust
        run: rustup default ${{ env.RUST_VERSION }}

      - name: Install 32-bit Windows target
        if: runner.os == 'Windows'
        run: rustup target add i686-pc-windows-msvc

      - name: Check 32-bit Windows ABI
        if: runner.os == 'Windows'
        run: cargo check --locked -p sealr --target i686-pc-windows-msvc

      - name: Run release tests
        run: cargo test --locked --release --workspace --all-features

  zipdiff:
    name: ZipDiff 14-class gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZIPDIFF_REVISION: 7c427ed254bb3a5985d54870c12f97db78118e67
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal

      - name: Select pinned Rust
        run: rustup default ${{ env.RUST_VERSION }}

      - name: Fetch pinned ZipDiff source
        run: |
          set -euo pipefail
          zipdiff_dir="${RUNNER_TEMP}/ZipDiff"
          git init "${zipdiff_dir}"
          git -C "${zipdiff_dir}" remote add origin https://github.com/ouuan/ZipDiff.git
          git -C "${zipdiff_dir}" fetch --depth 1 origin "${ZIPDIFF_REVISION}"
          git -C "${zipdiff_dir}" checkout --detach FETCH_HEAD
          test "$(git -C "${zipdiff_dir}" rev-parse HEAD)" = "${ZIPDIFF_REVISION}"

      - name: Make generated timestamps deterministic
        run: |
          set -euo pipefail
          zipdiff_dir="${RUNNER_TEMP}/ZipDiff"
          patch_file="${GITHUB_WORKSPACE}/tests/corpus/zipdiff/deterministic-timestamps.patch"
          git -C "${zipdiff_dir}" apply --check "${patch_file}"
          git -C "${zipdiff_dir}" apply "${patch_file}"
          grep -Fq 'Self::new(0, 0)' "${zipdiff_dir}/zip-diff/src/fields.rs"

      - name: Generate construction corpus
        working-directory: ${{ runner.temp }}/ZipDiff/zip-diff
        run: cargo run --locked --release --bin construction

      - name: Verify construction expectations
        run: >-
          cargo run --locked --release -p sealr --example classify_zipdiff --
          "${RUNNER_TEMP}/ZipDiff/constructions"
          --expect tests/corpus/zipdiff/expectations.txt

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal

      - name: Select pinned Rust
        run: rustup default ${{ env.RUST_VERSION }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Fetch supported release dependency graphs
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          cargo fetch --locked --target aarch64-apple-darwin
          cargo fetch --locked --target x86_64-pc-windows-msvc

      - name: Verify third-party license bundles
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/verify_third_party_licenses.ps1

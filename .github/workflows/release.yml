name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: 0.1.0-alpha.1
  RUST_VERSION: 1.98.0

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust
        run: rustup toolchain install "${RUST_VERSION}" --profile minimal

      - name: Select pinned Rust
        run: rustup default "${RUST_VERSION}"

      - name: Verify tag, version, and protected main
        shell: bash
        run: |
          set -euo pipefail

          expected_tag="v${RELEASE_VERSION}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::expected release tag ${expected_tag}, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [[ "$(git cat-file -t "${GITHUB_REF}")" != "tag" ]]; then
            echo "::error::release tag must be annotated"
            exit 1
          fi

          mapfile -t versions < <(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[].version' |
              sort -u
          )
          if [[ "${#versions[@]}" -ne 1 || "${versions[0]}" != "${RELEASE_VERSION}" ]]; then
            echo "::error::workspace package versions must all equal ${RELEASE_VERSION}"
            printf 'observed version: %s\n' "${versions[@]:-none}"
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          if [[ "${tag_commit}" != "${main_commit}" ]]; then
            echo "::error::release tag must point to the current protected main commit"
            echo "tag commit:  ${tag_commit}"
            echo "main commit: ${main_commit}"
            exit 1
          fi

          if [[ -n "$(git status --short)" ]]; then
            echo "::error::release checkout is not clean"
            git status --short
            exit 1
          fi

      - name: Require exact protected main CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        shell: bash
        run: |
          set -euo pipefail

          tag_commit="$(git rev-list -n 1 "${GITHUB_REF}")"
          required_jobs=(
            "Format, lint, test, and docs"
            "Test on windows-latest"
            "Test on macos-latest"
            "ZipDiff 14-class gate"
            "Supply chain"
          )
          run_json=""
          for attempt in {1..90}; do
            runs_json="$(
              gh api --method GET \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f branch=main \
                -f event=push \
                -f head_sha="${tag_commit}" \
                -f per_page=10
            )"
            run_json="$(
              jq -c \
                --arg sha "${tag_commit}" '
                  [.workflow_runs[] |
                    select(
                      .head_sha == $sha and
                      .head_branch == "main" and
                      .event == "push" and
                      (.path | startswith(".github/workflows/ci.yml"))
                    )] |
                  if length == 0 then empty else max_by(.run_number) end
                ' <<<"${runs_json}"
            )"
            if [[ -n "${run_json}" ]]; then
              status="$(jq -r '.status' <<<"${run_json}")"
              conclusion="$(jq -r '.conclusion // ""' <<<"${run_json}")"
              if [[ "${status}" == "completed" && "${conclusion}" == "success" ]]; then
                break
              fi
              if [[ "${status}" == "completed" ]]; then
                echo "::error::exact main CI concluded ${conclusion}"
                exit 1
              fi
            fi
            if [[ "${attempt}" -eq 90 ]]; then
              echo "::error::exact main CI did not complete successfully within 30 minutes"
              exit 1
            fi
            sleep 20
          done

          run_id="$(jq -r '.id' <<<"${run_json}")"
          run_attempt="$(jq -r '.run_attempt' <<<"${run_json}")"
          jobs_json="$(
            gh api --method GET \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}/jobs" \
              -f per_page=100
          )"
          for required in "${required_jobs[@]}"; do
            count="$(jq --arg name "${required}" '[.jobs[] | select(.name == $name)] | length' <<<"${jobs_json}")"
            if [[ "${count}" -ne 1 ]]; then
              echo "::error::expected exactly one CI job named ${required}, found ${count}"
              exit 1
            fi
            if ! jq -e \
              --arg name "${required}" '
                .jobs[] |
                select(.name == $name) |
                .status == "completed" and .conclusion == "success"
              ' <<<"${jobs_json}" >/dev/null; then
              echo "::error::required CI job did not complete successfully: ${required}"
              exit 1
            fi
          done

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "${tag_commit}" ]]; then
            echo "::error::protected main advanced while release validation was running"
            exit 1
          fi
          echo "exact protected main CI passed: run ${run_id}, attempt ${run_attempt}"

  build:
    name: Build and test on ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        shell: pwsh
        run: rustup toolchain install $env:RUST_VERSION --profile minimal

      - name: Select pinned Rust
        shell: pwsh
        run: rustup default $env:RUST_VERSION

      - name: Run optimized tests
        run: cargo test --locked --release --workspace --all-features

      - name: Build release binary
        run: cargo build --locked --release -p sealr-cli

      - name: Package and smoke-test native binary
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $targetLine = rustc -vV | Select-String -Pattern '^host: '
          if ($null -eq $targetLine) {
            throw "rustc did not report its host target"
          }
          $targetTriple = $targetLine.Line.Substring(6).Trim()
          $archiveBase = "sealr-$env:RELEASE_VERSION-$targetTriple"
          $packageParent = Join-Path $PWD "package"
          $packageRoot = Join-Path $packageParent $archiveBase
          $distRoot = Join-Path $PWD "dist"
          $binaryName = if ($IsWindows) { "sealr.exe" } else { "sealr" }

          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $distRoot -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD "target/release/$binaryName") -Destination $packageRoot
          Copy-Item -LiteralPath (Join-Path $PWD "README.md") -Destination $packageRoot
          Copy-Item -LiteralPath (Join-Path $PWD "CHANGELOG.md") -Destination $packageRoot
          Copy-Item -LiteralPath (Join-Path $PWD "LICENSE") -Destination $packageRoot
          if (-not $IsWindows) {
            chmod 755 (Join-Path $packageRoot $binaryName)
            if ($LASTEXITCODE -ne 0) {
              throw "chmod failed with exit code $LASTEXITCODE"
            }
          }

          if ($IsWindows) {
            $archivePath = Join-Path $distRoot "$archiveBase.zip"
            Push-Location $packageParent
            try {
              Compress-Archive -Path $archiveBase -DestinationPath $archivePath
            } finally {
              Pop-Location
            }
          } else {
            $archivePath = Join-Path $distRoot "$archiveBase.tar.gz"
            tar -C $packageParent -czf $archivePath $archiveBase
            if ($LASTEXITCODE -ne 0) {
              throw "tar failed with exit code $LASTEXITCODE"
            }
          }

          $smokeRoot = Join-Path $PWD "smoke"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          if ($IsWindows) {
            Expand-Archive -LiteralPath $archivePath -DestinationPath $smokeRoot
          } else {
            tar -C $smokeRoot -xzf $archivePath
            if ($LASTEXITCODE -ne 0) {
              throw "archive extraction failed with exit code $LASTEXITCODE"
            }
          }

          $packagedBinary = Join-Path (Join-Path $smokeRoot $archiveBase) $binaryName
          $reportedVersion = (& $packagedBinary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -ne "sealr $env:RELEASE_VERSION") {
            throw "packaged binary reported unexpected version: $reportedVersion"
          }
          & $packagedBinary --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "packaged binary help smoke test failed"
          }

          "archive=$archivePath" >> $env:GITHUB_OUTPUT
          "target=$targetTriple" >> $env:GITHUB_OUTPUT

      - name: Upload native release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}-${{ steps.package.outputs.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  stage:
    name: Attest and stage prerelease draft
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_PROMPT_DISABLED: "1"
    steps:
      - name: Check out tagged release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download native release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify archive set and create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          mapfile -t assets < <(
            find . -maxdepth 1 -type f \
              \( -name 'sealr-*.zip' -o -name 'sealr-*.tar.gz' \) \
              -printf '%f\n' |
              sort
          )
          if [[ "${#assets[@]}" -ne 3 ]]; then
            echo "::error::expected three native release archives, found ${#assets[@]}"
            printf 'asset: %s\n' "${assets[@]:-none}"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            if [[ "${asset}" != sealr-${RELEASE_VERSION}-* ]]; then
              echo "::error::unexpected release asset name: ${asset}"
              exit 1
            fi
          done

          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest native release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create or resume the exact prerelease draft
        shell: bash
        run: |
          set -euo pipefail

          release_title="sealr ${RELEASE_VERSION}: ZIP boundary preview"
          notes_file="docs/releases/v${RELEASE_VERSION}.md"
          if [[ ! -f "${notes_file}" ]]; then
            echo "::error::missing release notes: ${notes_file}"
            exit 1
          fi
          release_pages="$(
            gh api --method GET --paginate --slurp \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100"
          )"
          matching_releases="$(
            jq -ce --arg tag "${GITHUB_REF_NAME}" '
              if (type == "array" and all(.[]; type == "array")) then
                [.[][] | select(.tag_name == $tag)]
              else
                error("unexpected paginated releases response")
              end
            ' <<<"${release_pages}"
          )"
          matching_release_count="$(jq -er 'length' <<<"${matching_releases}")"
          mapfile -t local_assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#local_assets[@]}" -ne 4 ]]; then
            echo "::error::expected exactly four local release assets"
            exit 1
          fi

          existing_release=""
          existing_release_id=""
          case "${matching_release_count}" in
            0)
              create_payload="$(
                jq -cn \
                  --arg tag "${GITHUB_REF_NAME}" \
                  --arg target "${GITHUB_SHA}" \
                  --arg name "${release_title}" \
                  --rawfile body "${notes_file}" '
                    {
                      tag_name: $tag,
                      target_commitish: $target,
                      name: $name,
                      body: $body,
                      draft: true,
                      prerelease: true,
                      make_latest: "false"
                    }
                  '
              )"
              existing_release="$(
                gh api --method POST \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "repos/${GITHUB_REPOSITORY}/releases" \
                  --input - <<<"${create_payload}"
              )"
              existing_release_id="$(
                jq -er '.id | select(type == "number" and . > 0)' \
                  <<<"${existing_release}"
              )"
              ;;
            1)
              existing_release_id="$(
                jq -er '.[0].id | select(type == "number" and . > 0)' \
                  <<<"${matching_releases}"
              )"
              existing_release="$(
                gh api --method GET \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}"
              )"
              if ! jq -e \
                --arg tag "${GITHUB_REF_NAME}" \
                --argjson id "${existing_release_id}" \
                '.id == $id and .tag_name == $tag' \
                <<<"${existing_release}" >/dev/null; then
                echo "::error::release identity changed during discovery"
                exit 1
              fi
              ;;
            *)
              echo "::error::multiple releases use the expected tag"
              exit 1
              ;;
          esac

          if [[ "$(jq -r '.id' <<<"${existing_release}")" != "${existing_release_id}" || \
                "$(jq -r '.tag_name' <<<"${existing_release}")" != "${GITHUB_REF_NAME}" || \
                "$(jq -r '.draft' <<<"${existing_release}")" != "true" || \
                "$(jq -r '.prerelease' <<<"${existing_release}")" != "true" || \
                "$(jq -r '.immutable' <<<"${existing_release}")" != "false" || \
                "$(jq -r '.author.login' <<<"${existing_release}")" != "github-actions[bot]" ]]; then
            echo "::error::release is not the expected resumable draft"
            exit 1
          fi
          update_payload="$(
            jq -cn \
              --arg name "${release_title}" \
              --rawfile body "${notes_file}" '
                {
                  name: $name,
                  body: $body,
                  draft: true,
                  prerelease: true,
                  make_latest: "false"
                }
              '
          )"
          existing_release="$(
            gh api --method PATCH \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}" \
              --input - <<<"${update_payload}"
          )"
          expected_upload_url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}/assets{?name,label}"
          if [[ "$(jq -r '.id' <<<"${existing_release}")" != "${existing_release_id}" || \
                "$(jq -r '.tag_name' <<<"${existing_release}")" != "${GITHUB_REF_NAME}" || \
                "$(jq -r '.upload_url' <<<"${existing_release}")" != "${expected_upload_url}" ]]; then
            echo "::error::numeric release update changed release identity"
            exit 1
          fi

          existing_asset_count="$(jq -er '.assets | length' <<<"${existing_release}")"
          if [[ "${existing_asset_count}" -gt 4 ]] || ! jq -e '
            [.assets[].id] as $ids |
            ($ids | length) == ($ids | unique | length)
          ' <<<"${existing_release}" >/dev/null; then
            echo "::error::existing draft asset count or IDs are unsafe"
            exit 1
          fi
          mapfile -t existing_assets < <(jq -r '.assets[].name' <<<"${existing_release}")
          for asset in "${existing_assets[@]}"; do
            if [[ ! -f "dist/${asset}" ]] || ! jq -e \
              --arg name "${asset}" '
                [.assets[] |
                  select(
                    .name == $name and
                    (.id | type == "number" and . > 0) and
                    .uploader.login == "github-actions[bot]" and
                    (
                      (
                        .state == "uploaded" and
                        .size > 0 and
                        (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
                      ) or
                      .state == "starter"
                    )
                  )] |
                length == 1
              ' <<<"${existing_release}" >/dev/null; then
              echo "::error::existing draft contains an unsafe asset: ${asset}"
              exit 1
            fi
          done

          mapfile -t existing_asset_ids < <(jq -r '.assets[].id' <<<"${existing_release}")
          for asset_id in "${existing_asset_ids[@]}"; do
            expected_asset="$(
              jq -ce --argjson id "${asset_id}" '.assets[] | select(.id == $id)' \
                <<<"${existing_release}"
            )"
            asset_json="$(
              gh api --method GET \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            )"
            if ! jq -e --argjson expected "${expected_asset}" '
              .id == $expected.id and
              .name == $expected.name and
              .state == $expected.state and
              .size == $expected.size and
              .digest == $expected.digest and
              .uploader.login == $expected.uploader.login
            ' <<<"${asset_json}" >/dev/null; then
              echo "::error::release asset changed before numeric deletion: ${asset_id}"
              exit 1
            fi
            gh api --method DELETE --silent \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

          existing_release="$(
            gh api --method GET \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}"
          )"
          if ! jq -e \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg name "${release_title}" \
            --argjson id "${existing_release_id}" \
            --rawfile notes "${notes_file}" '
              .id == $id and
              .tag_name == $tag and
              .name == $name and
              .body == $notes and
              .draft == true and
              .prerelease == true and
              .immutable == false and
              .author.login == "github-actions[bot]" and
              (.assets | length) == 0
            ' <<<"${existing_release}" >/dev/null; then
            echo "::error::release changed before numeric asset uploads"
            exit 1
          fi

          for asset in "${local_assets[@]}"; do
            local_digest="sha256:$(sha256sum "dist/${asset}" | cut -d' ' -f1)"
            local_size="$(stat -c '%s' -- "dist/${asset}")"
            case "${asset}" in
              *.zip) content_type="application/zip" ;;
              *.tar.gz) content_type="application/gzip" ;;
              SHA256SUMS) content_type="text/plain; charset=utf-8" ;;
              *)
                echo "::error::unsupported release asset type: ${asset}"
                exit 1
                ;;
            esac
            encoded_asset="$(jq -rn --arg value "${asset}" '$value | @uri')"
            upload_response="$(
              curl --fail-with-body --silent --show-error \
                --proto '=https' \
                --request POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                -H "Content-Type: ${content_type}" \
                --data-binary "@dist/${asset}" \
                --url "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${existing_release_id}/assets?name=${encoded_asset}"
            )"
            if ! jq -e \
              --arg name "${asset}" \
              --arg type "${content_type}" \
              --arg digest "${local_digest}" \
              --argjson size "${local_size}" '
                (.id | type == "number") and .id > 0 and
                .name == $name and
                .state == "uploaded" and
                .content_type == $type and
                .size == $size and
                .digest == $digest and
                .uploader.login == "github-actions[bot]"
              ' <<<"${upload_response}" >/dev/null; then
              echo "::error::uploaded asset failed identity or digest verification: ${asset}"
              exit 1
            fi
          done

          readback_pages="$(
            gh api --method GET --paginate --slurp \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100"
          )"
          readback_matches="$(
            jq -ce --arg tag "${GITHUB_REF_NAME}" '
              if (type == "array" and all(.[]; type == "array")) then
                [.[][] | select(.tag_name == $tag)]
              else
                error("unexpected paginated releases response")
              end
            ' <<<"${readback_pages}"
          )"
          if [[ "$(jq -er 'length' <<<"${readback_matches}")" -ne 1 ]]; then
            echo "::error::draft release readback did not find exactly one matching release"
            exit 1
          fi
          readback_release_id="$(
            jq -er '.[0].id | select(type == "number" and . > 0)' \
              <<<"${readback_matches}"
          )"
          if [[ "${readback_release_id}" != "${existing_release_id}" ]]; then
            echo "::error::resumed release identity changed before readback"
            exit 1
          fi
          release_json="$(
            gh api --method GET \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/releases/${readback_release_id}"
          )"
          if [[ "$(jq -r '.draft' <<<"${release_json}")" != "true" || \
                "$(jq -r '.prerelease' <<<"${release_json}")" != "true" || \
                "$(jq -r '.immutable' <<<"${release_json}")" != "false" || \
                "$(jq -r '.author.login' <<<"${release_json}")" != "github-actions[bot]" || \
                "$(jq -r '.id' <<<"${release_json}")" != "${readback_release_id}" || \
                "$(jq -r '.tag_name' <<<"${release_json}")" != "${GITHUB_REF_NAME}" || \
                "$(jq -r '.name' <<<"${release_json}")" != "${release_title}" ]]; then
            echo "::error::draft release identity did not pass readback verification"
            exit 1
          fi
          if ! jq -e --rawfile notes "${notes_file}" '.body == $notes' <<<"${release_json}" >/dev/null; then
            echo "::error::draft release body differs from the tagged release notes"
            exit 1
          fi

          mapfile -t local_assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t remote_assets < <(jq -r '.assets[].name' <<<"${release_json}" | sort)
          if [[ "${#local_assets[@]}" -ne 4 || \
                "$(printf '%s\n' "${local_assets[@]}")" != "$(printf '%s\n' "${remote_assets[@]}")" ]]; then
            echo "::error::draft release asset set differs from the exact local four-asset set"
            exit 1
          fi
          for asset in "${local_assets[@]}"; do
            local_digest="sha256:$(sha256sum "dist/${asset}" | cut -d' ' -f1)"
            if ! jq -e \
              --arg name "${asset}" \
              --arg digest "${local_digest}" '
                [.assets[] |
                  select(
                    .name == $name and
                    .state == "uploaded" and
                    .size > 0 and
                    .digest == $digest and
                    .uploader.login == "github-actions[bot]"
                  )] |
                length == 1
              ' <<<"${release_json}" >/dev/null; then
              echo "::error::draft asset failed state, size, or digest verification: ${asset}"
              exit 1
            fi
          done
          echo "verified prerelease draft; publication requires scripts/publish_release.ps1"

name: ClusterFuzzLite PR fuzzing

# Bounded per-change discovery fuzzing. This lane is informational: it is not
# part of the one required-CI promotion authority, never produces a coverage
# or correctness score, and may be promoted only under the ten-clean-runs rule
# in docs/assurance-promotion.md. The scheduled fuzz.yml campaign remains the
# pinned-toolchain, manifest-verified reproducibility contract; this container
# toolchain rolls with the pinned base image digest instead.

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'fuzz/**'
      - 'Cargo.lock'
      - '.clusterfuzzlite/**'

permissions: read-all

concurrency:
  group: cflite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Build changed fuzz targets
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
      - name: Fuzz changed code
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address

version: 2
# Prepare dependency updates together under the repository owner's identity.
# Disable automatic version PRs so they cannot add another Git author.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      cargo-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    groups:
      fuzz-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 0

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "The zip crate is used only through ZipWriter to build fixtures. Sealr never calls ZipArchive::extract or ZipStreamReader::extract, and its own parser admits archives." },
  { id = "RUSTSEC-2026-0368", reason = "The zip crate is used only through ZipWriter to build fixtures. Sealr never calls ZipArchive::extract or ZipStreamReader::extract, and its own parser admits archives." },
  { id = "RUSTSEC-2026-0369", reason = "The zip crate is used only through ZipWriter to build fixtures. Sealr never calls ZipArchive::extract or ZipStreamReader::extract, and its own parser admits archives." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  # The BSD-style bzip2 license, added deliberately for libbz2-rs-sys in the
  # executed bzip2 Gate B promotion.
  "bzip2-1.0.6",
  "MIT",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

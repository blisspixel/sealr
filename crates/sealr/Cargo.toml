[package]
name = "sealr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"
description.workspace = true
repository.workspace = true
publish = ["crates-io"]

[package.metadata.cargo-semver-checks.lints]
# Alpha.11 exposed these shapes before the pre-freeze API review. Scheduled
# assurance pins their exact warning instances and refuses any additional debt.
struct_marked_non_exhaustive = "warn"
struct_pub_field_missing = "warn"
struct_pub_field_now_doc_hidden = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[package.metadata.kani.flags]
default-unwind = "1"

[features]
# Enables only the external cargo-fuzz entry point. This is not a shipped API.
__internal-fuzzing = []
# Enables only the repository Linux worker conformance bridge. This is not a
# shipped API or a supported runtime activation surface.
__internal-worker-lab = []
# Enables only the repository native materialization lifecycle seam. This is
# not a shipped API or a supported runtime activation surface.
__internal-lifecycle-lab = []

[dependencies]
bzip2.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
caseless.workspace = true
crc32fast.workspace = true
flate2.workspace = true
getrandom.workspace = true
lzma-rust2.workspace = true
pep440_rs.workspace = true
ruzstd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
twox-hash.workspace = true
unicode-general-category.workspace = true
unicode-normalization.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
rustix = { version = "1.1", features = ["fs", "net", "pipe", "process", "thread"] }

[target.'cfg(any(target_os = "android", target_os = "macos"))'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[dev-dependencies]
crc32fast.workspace = true
twox-hash.workspace = true
zip.workspace = true

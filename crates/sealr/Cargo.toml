[package]
name = "sealr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
publish = false

[features]
# Enables only the external cargo-fuzz entry point. This is not a shipped API.
__internal-fuzzing = []
# Enables only the repository Linux worker conformance bridge. This is not a
# shipped API or a supported runtime activation surface.
__internal-worker-lab = []

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
crc32fast.workspace = true
flate2.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[dev-dependencies]
zip.workspace = true
